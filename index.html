<style>
:root{--y:#ff0;--o:#ff7a00;--r:#f00;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
body{margin:0;background:#000;color:#fff;font:17px/1.5 'DotGothic16','Courier New',monospace;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#g{max-width:640px;margin:0 auto;padding:10px;min-height:100vh;display:flex;flex-direction:column;gap:8px}
.box{border:4px solid #fff;padding:10px 12px;background:#000;white-space:pre-wrap;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tall{min-height:84px}.c{text-align:center}
h2{margin:0 0 8px;font-weight:normal;color:var(--y);font-size:19px}
button{position:relative;font:inherit;color:#fff;background:#000;border:3px solid var(--o);padding:8px 20px;cursor:pointer;flex:1;touch-action:manipulation;white-space:nowrap}
button.sel{color:var(--y);border-color:var(--y)}
button.sel::before{content:'♥';position:absolute;left:5px;top:50%;transform:translateY(-50%);color:var(--r);font-size:13px}
.sm{justify-content:center;gap:8px}.sm button{flex:0 0 auto;padding:9px 18px;font-size:16px}.sm button.sel::before{left:4px;font-size:11px}#g>.c{margin:auto 0;padding:8px 10px}#g>.c h2{font-size:17px;margin-bottom:4px}
canvas{display:block;image-rendering:pixelated}
.top{display:flex;align-items:center;justify-content:center;gap:14px}
#mc{height:clamp(64px,22vh,130px);width:auto}
.info{display:flex;flex-direction:column;gap:2px;font-size:14px}
#nm{font-size:15px}
#arena{position:relative;width:min(100%,calc((100vh - 70px - clamp(64px,22vh,130px))*2.4));margin:0 auto}
#cv{width:100%;border:4px solid #fff;box-sizing:border-box;background:#000;touch-action:none}
#arena #txt{position:absolute;inset:4px;padding:8px 10px;font-size:14px;line-height:1.35;overflow:hidden;pointer-events:none;white-space:pre-wrap}
.b{flex-wrap:nowrap;width:100%}.b button{padding:10px 2px;font-size:13px;min-width:0}
#bar{width:60px;height:14px;background:var(--r);display:inline-block}#bar i{display:block;height:100%;background:var(--y)}
#cont{color:#888;font-size:14px;text-align:right}
small{color:#888;font-size:12px}
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:6px 22px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none;touch-action:none}
#pad button{pointer-events:auto;flex:none;padding:0;border-color:#888;background:#111;font-size:15px}
#pad button:active{background:#333;color:var(--y)}
.dp{display:grid;grid-template:repeat(3,54px)/repeat(3,54px);gap:4px}
.dp button{width:54px;height:54px;font-size:22px}
.dp [data-k=u]{grid-area:1/2}.dp [data-k=l]{grid-area:2/1}.dp .cc{grid-area:2/2;border:3px solid #444;background:#000}.dp [data-k=r]{grid-area:2/3}.dp [data-k=d]{grid-area:3/2}
#joy{pointer-events:auto;position:relative;width:136px;height:136px;border-radius:50%;border:4px solid #888;background:radial-gradient(#222,#0a0a0a);touch-action:none}#knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:#555;border:4px solid #ddd;pointer-events:none}.ab{display:flex;gap:10px}.ab button{width:76px;height:76px;border-radius:50%;font-size:26px}
@media (hover:hover) and (pointer:fine){#pad{display:none}}
@media (hover:none){#g{padding-bottom:190px}.hint{display:none}}
*{-webkit-touch-callout:none}
button,canvas,#pad,#joy{touch-action:none}
html,body{overscroll-behavior:none}
@media (hover:none) and (orientation:landscape){#g{padding:4px 168px;gap:4px}}

end:['За ГЛЮКом открывается огромная дверь. Из щели льётся свет.','Голос, которого ты раньше не слышал(а), шепчет: «Почти пришли».','Дальше — ФИНАЛ. Но сначала нам нужно поговорить. О чём-то особенном.','...Позже.']},

{t:'第二章：噪点走廊',intro:['空气中出现了雪花点。地板的纹理一闪一闪。','“嘶——”一团破碎的像素飘到你面前。','它叫故障。它真的需要更新了。'],

m:{n:'ҚАҚ',a:['Тексеру','Әзілдеу','Флирт'],r:['ҚАҚ — ШАБ 3 ҚОР 1\n* Назар аударғысы келетін бақа.','Сен тоған туралы әзіл айттың. ҚАҚ мырс етіп, мақтанышпен кеудесін керді.','Сен көз қақтың. ҚАҚ-тың құлағы қызарды. Жасыл болса да.'],fl:['ҚАҚ саған қарап тұр. Қақ.','Ауада ылғал мен үміттің иісі бар.','ҚАҚ шыбын жеп жатыр. Сен байқамағандай боласың.'],say:['Қақ-қақ! (Бұл «қорған» дегенді білдіреді.)','ҚАҚ! (Бұл «тағы бір рет».)','Қақ... (Бұл «жарайды, соңғы рет».)'],sp:'ҚАҚ сары түспен жарқырады. Ол енді төбелескісі келмейді.',dead:'ҚАҚ пиксельге айналды. +3 EXP. Көңіліңе ауыр тиді.',spared:'ҚАҚ қуанып секіріп кетті. Ештеңе алмадың, тек жүрегің жылынды.'}},
{t:'2-ТАРАУ: Кедергі дәлізі',intro:['Ауада қар тәрізді кедергілер пайда болды. Еденнің текстурасы жыпылықтайды.','«Ш-ш-ш...» — бұзылған пиксельдер бұлты саған қарай жүзіп келеді.','Оның аты ҒЛЮК. Оған шынымен жаңарту керек.'],
m:{n:'ҒЛЮК',a:['Тексеру','Қайта қосу','Мақтау'],r:['ҒЛЮК — ШАБ 5 ҚОР 0\n* Бұзылған пиксельден жаралған елес. Жаңарту қажет.','Сен ауада «Ctrl+Alt+Del» бастың. ҒЛЮК жыпылықтады... және өз атын есіне алды.','Сен оның түстерін мақтадың. ҒЛЮК қызғылт болып жарқырады. Баяғыда мақтау естімеген.'],fl:['ҒЛЮК дірілдейді. Шу сенің атыңды сыбырлайды.','Жер бір сәтке текстурасын жоғалтты.','ҒЛЮК бір сөзді қайта-қайта қайталайды.'],say:['Ш-ш-ш... [ҚАТЕ 404: АЯУ]','Жүктелуде... 99%... 99%... 99%...','Рахмет... мені... жаппағаныңа...'],sp:'ҒЛЮК тұрақтанды. Ол «АЯУ» түймесіне үмітпен қарайды.',dead:'ҒЛЮК 0 мен 1-ге бөлшектенді. +5 EXP. Тыныштық күшейе түсті.',spared:'ҒЛЮК жылы жарықта еріп кетті. Файл сақталды.'}}],
end:['ҒЛЮК артында үлкен есік ашылды. Саңылаудан жарық ағады.','Сен бұрын естімеген дауыс сыбырлады: «Жақындадық».','Әрі қарай — ФИНАЛ. Бірақ алдымен сөйлесуіміз керек. Ерекше нәрсе туралы.','...Кейін.']}};
